name: Daily Log Update

on:
  schedule:
    - cron: "0 */4 * * *"   # Runs every 4 hours (6 commits/day)
  workflow_dispatch: {}

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run log updater
        run: python .github/workflows/update_log.py

      - name: Commit and push if there are changes
        run: |
          git config --global user.name "Chitranshu2006"
          git config --global user.email "chitranshu2006@users.noreply.github.com"
          git add LOG.md
          git diff --cached --quiet || git commit -m "chore: update daily activity log [skip ci]"
          git push
